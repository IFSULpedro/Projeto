<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Bootstrap CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Produtos</span>
        </div>
    </nav>

    <div class="container mt-5">
        <h1>Gerenciamento de Produtos com JSON+LocalStorage</h1>
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Categoria</th>
                    <th>Disponível</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela">
                <tr>
                    <td>A35</td>
                    <td>999</td>
                    <td>xxxxx</td>
                    <td>Sim</td>
                    <td> <button class="btn btn-sm btn-danger">Excluir</button>
                    </td>
                </tr>

            </tbody>
        </table>


    </div>

    <div class="container p-4 mt-5 b-5 border rounded">
        <div class="alert d-none alert-success alert-dismissible fade show" role="alert"
        id="alertaSucesso">
  <strong>Sucesso!</strong> O produto foi cadastrado com sucesso.
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
        <form id="formulario">
            <div class="mb-3">
                <label for="id" class="form-label">ID</label>
                <input type="text" class="form-control" id="id" readonly disabled>
            </div>
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" required>
            </div>

            <div class="mb-3">
                <label for="preco" class="form-label">Preço</label>
                <input type="number" class="form-control" id="preco" required>
            </div>

            <div class="mb-3">
                <label for="categoria" class="form-label">Categoria</label>
                <select class="form-select" id="categoria" required>
                    <option value="">Selecione...</option>
                    <option value="celular">Celular</option>
                    <option value="notebook">Notebook</option>
                    <option value="desktop">Desktop</option>

                </select>
            </div>

            <div class="mb-3">
                <label for="disponivel" class="form-label">Disponível</label>
                <input type="checkbox"  id="disponivel" class="form-checkbox" />
            </div>

            <button type="button" class="btn btn-primary" onclick="gravarDoForm()">Enviar</button>
             <button type="reset" class="btn btn-warning">Limpar</button>
        </form>
        
    </div>

    <!-- Bootstrap JavaScript via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="produtos.js"></script>
<script>
    //código personalizado
    let resultado = listar()
    const tabela = document.getElementById("tabela")
    tabela.innerHTML = resultado
</script>
</body>

</html>
